<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>LifePilot MCP App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f7f5fb;
      color: #333;
      line-height: 1.6;
      padding: 20px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1e1e1e;
        color: #f0f0f0;
      }
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      main {
        background: #2d2d2d;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      color: #6443c9;
    }

    @media (prefers-color-scheme: dark) {
      h1 {
        color: #b8a4fa;
      }
    }

    .plan-section {
      margin-bottom: 30px;
    }

    .plan-section h2 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #555;
      border-bottom: 2px solid #6443c9;
      padding-bottom: 8px;
    }

    @media (prefers-color-scheme: dark) {
      .plan-section h2 {
        color: #aaa;
        border-bottom-color: #b8a4fa;
      }
    }

    .plan-section ul {
      list-style: none;
      padding-left: 0;
    }

    .plan-section li {
      padding: 8px 0;
      padding-left: 24px;
      position: relative;
      color: #666;
    }

    @media (prefers-color-scheme: dark) {
      .plan-section li {
        color: #ccc;
      }
    }

    .plan-section li:before {
      content: '→';
      position: absolute;
      left: 0;
      color: #6443c9;
      font-weight: bold;
    }

    @media (prefers-color-scheme: dark) {
      .plan-section li:before {
        color: #b8a4fa;
      }
    }

    .plan-section p {
      color: #666;
      margin-bottom: 12px;
    }

    @media (prefers-color-scheme: dark) {
      .plan-section p {
        color: #ccc;
      }
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .error {
      background: #ffebee;
      border: 1px solid #f5a6a6;
      border-radius: 4px;
      padding: 16px;
      color: #c62828;
      margin-bottom: 20px;
    }

    @media (prefers-color-scheme: dark) {
      .error {
        background: #3d1f1f;
        border-color: #5d2e2e;
        color: #ff8a80;
      }
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #6443c9;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>LifePilot · Your action plan</h1>
    <div id="plan-container" class="loading">
      <div class="spinner"></div>
      <p>Generating your plan...</p>
    </div>
  </main>
  <script type="module" src="/mcp-app.ts"></script>
</body>
</html>
